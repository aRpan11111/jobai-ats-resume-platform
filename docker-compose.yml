version: "3.8"

services:
  db:
    image: mariadb:10.11
    container_name: jobai_db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: jobai
      MARIADB_USER: jobai_user
      MARIADB_PASSWORD: jobai_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
